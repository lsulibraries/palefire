$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Table of contents
status: stable
description: 'Sticky "On this page" navigation for Modular pages. Collapsible below the lg breakpoint; highlights the section in view.'
props:
  type: object
  required:
    - items
  properties:
    heading:
      type: string
      title: Heading
      default: 'On this page'
    toc_id:
      type: string
      title: 'Base HTML ID'
      default: pf-toc
    items:
      type: array
      title: Items
      items:
        type: object
        properties:
          anchor:
            type: string
          label:
            type: string
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
    - palefire/bootstrap

# Font Awesome Pro 5.15.4. Licensed, so it is not in this (public) repo: the
# files live in the site's /libraries/fontawesome-pro (Drupal root), hence the
# leading slash. Not attached by the theme: menu--utility.html.twig inlines
# FA SVGs instead (no CSS or webfont). Attach it only where an FA icon class
# is printed.
fontawesome:
  version: 5.15.4
  css:
    theme:
      /libraries/fontawesome-pro/css/fontawesome.min.css: { minified: true }
      /libraries/fontawesome-pro/css/duotone.min.css: { minified: true }
      /libraries/fontawesome-pro/css/solid.min.css: { minified: true }
      /libraries/fontawesome-pro/css/brands.min.css: { minified: true }

bento-video:
  js:
    js/bento-video.js: {}
  dependencies:
    - core/drupal
    - core/once

# Landing hero: "Next event" card from the events carousel's feed. Attached
# by paragraph--bento-search.html.twig only for the landing hero.
hero-event:
  js:
    js/hero-event.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once

# Visit card in the bento (Modular page Visit fields): LibCal hours and the
# click-to-load Google map. Attached by _palefire_bento_visit() in
# palefire.theme only when the page fills in a Visit field.
visit:
  version: 1.0.0
  js:
    js/visit-hours.js: {}
    js/visit-map.js: {}
  dependencies:
    - core/drupal
    - core/once

# Guide: Video blocks. Swaps the thumbnail link for the YouTube

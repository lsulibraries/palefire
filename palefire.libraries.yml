# Font Awesome Pro 5.15.4. Licensed, so it is not in this (public) repo: the
# files live in the site's /libraries/fontawesome-pro (Drupal root), hence the
# leading slash. Not attached by the theme: menu--utility.html.twig inlines
# FA SVGs instead (no CSS or webfont). Attach it only where an FA icon class
# is printed.
fontawesome:
  version: 5.15.4
  css:
    theme:
      /libraries/fontawesome-pro/css/fontawesome.min.css: { minified: true }
      /libraries/fontawesome-pro/css/duotone.min.css: { minified: true }
      /libraries/fontawesome-pro/css/solid.min.css: { minified: true }
      /libraries/fontawesome-pro/css/brands.min.css: { minified: true }

landing-video:
  js:
    js/landing-video.js: {}
  dependencies:
    - core/drupal
    - core/once

# Modular pages: section headings and the Events carousel animate in on
# scroll. Attached by
# templates/field/field--node--field-scroll-section--modular-page.html.twig.
section-reveal:
  js:
    js/section-reveal.js: {}
  dependencies:
    - core/drupal
    - core/once

# Tile showcase: cards animate in on scroll, as on the Origami concept page.
# Attached by templates/paragraphs/paragraph--tile-showcase.html.twig.
tile-reveal:
  js:
    js/tile-reveal.js: {}
  dependencies:
    - core/drupal
    - core/once

# Landing with a lead panel and a map: the page snaps between the two (md
# and up). Attached by includes/landing.html.twig.
landing-snap:
  js:
    js/landing-snap.js: {}
  dependencies:
    - core/drupal
    - palefire/global

# Landing hero: exhibition tiles with several images crossfade, with a
# pause button. Attached by includes/landing.html.twig only when a tile has
# more than one image.
exhibit-rotate:
  js:
    js/exhibit-rotate.js: {}
  dependencies:
    - core/drupal
    - core/once

# Landing hero: "Next event" card from the events carousel's feed. Attached
# by includes/landing.html.twig only for the landing hero.
hero-event:
  js:
    js/hero-event.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once

# Visit card in the landing (Modular page Visit fields): LibCal hours and the
# click-to-load Google map. Attached by _palefire_landing_visit() in
# palefire.theme only when the page fills in a Visit field.
visit:
  version: 1.0.0
  js:
    js/visit-hours.js: {}
    js/visit-map.js: {}
  dependencies:
    - core/drupal
    - core/once

# Guide: Video blocks. Swaps the thumbnail link for the YouTube
# (privacy-enhanced) or Vimeo player on click. Attached by
# templates/paragraphs/paragraph--guide-video.html.twig.
guide-video:
  version: 1.0.0
  js:
    js/guide-video.js: {}
  dependencies:
    - core/drupal
    - core/once

# "On this page" scroll tracking, moving indicator and Guide sub-links.
# Attached by templates/navigation/palefire-modular-toc.html.twig.
modular-toc:
  version: 1.0.0
  js:
    js/modular-toc.js: {}
  dependencies:
    - core/drupal
    - core/once
    - palefire/global

# Hide / show the TOC sidebar (lg and up, every Modular page but guides).
# Attached by page.html.twig on Modular pages with a TOC. Loads in <head> so
# the state is on <html> before the page paints (no flash, no animation on
# load); that also moves core/drupal and core/once to <head> on those pages.
modular-toc-collapse:
  version: 1.0.0
  header: true
  js:
    js/modular-toc-collapse.js: {}
  dependencies:
    - core/drupal
    - core/once

# Hill Memorial building map (landing section). Attached by
# templates/paragraphs/paragraph--building-map.html.twig.
building-map:
  version: 1.0.0
  js:
    js/building-map.js: {}
  dependencies:
    - core/drupal
    - core/once

# Louisiana Newspapers guide: the parish map (choose a parish, fill the
# panel, draw-on). Attached by paragraph--parish-map.html.twig.
parish-map:
  version: 1.0.0
  js:
    js/parish-map.js: {}
  dependencies:
    - core/drupal
    - core/once

# Louisiana Newspapers guide: search and filter the family trees. Attached
# by paragraph--family-trees.html.twig.
family-trees:
  version: 1.0.0
  js:
    js/family-trees.js: {}
  dependencies:
    - core/drupal
    - core/once

# Louisiana Newspapers guide: a family tree in a full-screen viewer, drawn
# from its Diagram page. Attached by paragraph--parish-map.html.twig and
# paragraph--family-trees.html.twig.
family-tree-viewer:
  version: 1.0.0
  js:
    js/family-tree-viewer.js: {}
  dependencies:
    - core/drupal
    - core/drupal.announce
    - core/once
    - palefire/viewer

# The full-screen viewer (stage, toolbar, text panel) that exhibitions and
# the newspaper family trees show things in. A dependency of those two
# libraries only, so other pages never load it. Styles: _viewer.scss.
viewer:
  version: 1.0.0
  js:
    js/viewer.js: { weight: -2 }
  dependencies:
    - core/drupal

# Utility menu panels (offcanvas drawers from the left): live clock and
# LibCal hours. Attached by page.html.twig when the Utility menu region has
# content. Needs palefire/visit for Drupal.palefireHours (visit-hours.js).
utility-panels:
  version: 1.0.0
  js:
    js/utility-panels.js: {}
  dependencies:
    - core/drupal
    - core/once
    - palefire/global
    - palefire/visit

# Exhibition pages: one gallery at a time, title page, lightbox, long
# biographies, audio. Attached by includes/exhibit-cover.html.twig. Lighter
# weight so it runs before modular-toc.js, which reads what is shown.
exhibition:
  js:
    js/exhibition.js: { weight: -1 }
  dependencies:
    - core/drupal
    - core/once
    - palefire/global
    - palefire/viewer

# Site footer (includes/footer.html.twig): starts the footer's LibCal hours
# once it nears the viewport. Attached by page.html.twig on every page.
footer:
  version: 1.0.0
  js:
    js/footer.js: {}
  dependencies:
    - core/drupal
    - core/once
    - palefire/visit

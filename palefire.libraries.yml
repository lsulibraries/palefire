# Compiled Bootstrap 5.3 + Palefire styles (npm run build) and theme behaviors.
global:
  version: 1.0.0
  css:
    theme:
      css/style.css: {  }
  js:
    js/palefire.js: {  }
  dependencies:
    - core/drupal
    - core/once
    - palefire/bootstrap

# Bootstrap JS bundle (includes Popper) copied from node_modules by npm run build.
bootstrap:
  version: 5.3.8
  js:
    js/vendor/bootstrap.bundle.min.js: { minified: true }

# Swup 4 page transitions. Attached for anonymous visitors only
# (templates/layout/page.html.twig). js/vendor/swup.umd.js is copied from
# node_modules by npm run build; palefire-swup.js does nothing without it.
swup:
  version: 1.1.0
  js:
    js/vendor/swup.umd.js: { minified: true }
    js/palefire-swup.js: {  }
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/drupal.announce
    - core/once
    - palefire/global

